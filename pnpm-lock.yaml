      typescript:
        specifier: workspace:*
        version: link:../typescript

  packages/tsx: {}

  packages/typescript: {}

  packages/vite:
    devDependencies:
      typescript:
        specifier: workspace:*
        version: link:../typescript

  packages/zod:
    devDependencies:
      typescript:
        specifier: workspace:*
        version: link:../typescript
