lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      prettier:
        specifier: workspace:*
        version: link:packages/prettier
      typescript:
        specifier: workspace:*
        version: link:packages/typescript

  apps/api:
    dependencies:
      '@hono/node-server':
        specifier: workspace:*
        version: link:../../packages/hono-node-server
      agent-runner:
        specifier: workspace:*
        version: link:../../packages/agent-runner
      hono:
        specifier: workspace:*
        version: link:../../packages/hono
      shared:
        specifier: workspace:*
        version: link:../../packages/shared
      zod:
        specifier: workspace:*
        version: link:../../packages/zod
    devDependencies:
      tsx:
        specifier: workspace:*
        version: link:../../packages/tsx
      typescript:
        specifier: workspace:*
        version: link:../../packages/typescript

  apps/web:
    dependencies:
      '@vitejs/plugin-react':
        specifier: workspace:*
        version: link:../../packages/plugin-react
      react:
        specifier: workspace:*
        version: link:../../packages/react
      react-dom:
        specifier: workspace:*
        version: link:../../packages/react-dom
      shared:
        specifier: workspace:*
        version: link:../../packages/shared
    devDependencies:
      typescript:
        specifier: workspace:*
        version: link:../../packages/typescript
      vite:
        specifier: workspace:*
        version: link:../../packages/vite

  packages/agent-runner:
