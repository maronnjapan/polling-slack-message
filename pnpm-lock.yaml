        version: link:../typescript

  packages/hono-node-server:
    devDependencies:
      typescript:
        specifier: workspace:*
        version: link:../typescript

  packages/plugin-react:
    devDependencies:
      typescript:
        specifier: workspace:*
        version: link:../typescript

  packages/prettier: {}

  packages/react:
    devDependencies:
      typescript:
        specifier: workspace:*
        version: link:../typescript

  packages/react-dom:
    devDependencies:
      typescript:
        specifier: workspace:*
        version: link:../typescript

  packages/react-dom-client:
